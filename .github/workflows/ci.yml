name: CI

# Runs on every push and PR to main. The web build type-checks the whole repo
# (root tsconfig excludes mobile/, which has its own), so both apps are covered.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build-time only. The real key is set in Vercel; a placeholder keeps
          # the seedless path compiling without putting a secret in CI.
          NEXT_PUBLIC_BREEZ_API_KEY: ci-placeholder

  mobile:
    name: mobile — types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # --ignore-scripts skips the Kotlin patch postinstall, which only matters
      # for native builds on EAS, not for type-checking.
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # A real gate now, not advisory. The Next 15 upgrade took the tree from
    # 2 critical / 13 high to 0 critical / 1 high, so "no criticals" is a bar
    # we can actually hold. The remaining high is postcss inside Next itself
    # (build-time; needs Next 16) and the lows are the fixture-only bolt11
    # devDependency — raise this to --audit-level=high once those clear.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm audit --audit-level=critical --package-lock-only
